[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-main-agent"
version = "0.1.0"
description = "An interactive research planning agent with explicit human confirmation."
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-openai>=1.7,<2",
  "pydantic>=2.14,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
research-main-agent = "research_main_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
